name: Book

on:
  pull_request:
    paths: &paths
      - book/**
      - .github/workflows/book.yml
  push:
    branches: [main]
    paths: *paths

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2
        with:
          tool: mdbook@0.5.4
      - run: mdbook build book
