name: Mutation testing

# Manual only, because a full run is expensive. Do not add other triggers.
on:
  workflow_dispatch:
    inputs:
      file:
        description: Only mutate files matching this glob, e.g. src/lib.rs (empty for all)
        required: false
        type: string

permissions:
  contents: read

# Queue a second run instead of paying for two at once.
concurrency:
  group: mutants
  cancel-in-progress: false

jobs:
  mutants:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2
        with:
          tool: cargo-mutants@27.1.0
      - name: Run cargo-mutants
        env:
          FILE_GLOB: ${{ inputs.file }}
        run: |
          args=()
          if [ -n "$FILE_GLOB" ]; then
            args+=(--file "$FILE_GLOB")
          fi
          cargo mutants --all-features "${args[@]}"
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutants.out
          path: mutants.out
          if-no-files-found: warn
