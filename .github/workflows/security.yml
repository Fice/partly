name: Security

on:
  # Advisories are published independently of this repo, so check regularly.
  # Schedules only run from the default branch.
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
  pull_request:
    paths: &paths
      - Cargo.lock
      - deny.toml
      - .github/workflows/security.yml
  push:
    branches: [main]
    paths: *paths

permissions:
  contents: read

jobs:
  advisories:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2
        with:
          tool: cargo-deny@0.20.2
      - run: cargo deny --locked check advisories
